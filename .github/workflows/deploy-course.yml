name: deploy-course

# 客户使用教程静态站构建发布(VitePress)。
# 权威定义在私有仓库 course/pipeline/ 本文件,由私有仓库 course-dispatch
# 同步到本仓库;course/** 有推送(含 course-dispatch 的同步 commit)即自动
# 构建发布到 GitHub Pages。全部使用官方 actions,无需额外 secrets。
# 注意:项目站部署在 /xr-h1-ros2-pub/ 子路径,base 已在 course/.vitepress/config.mjs 配置。
on:
  push:
    branches: [main]
    paths:
      - "course/**"
      - ".github/workflows/deploy-course.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: course/package-lock.json
      - name: Build site (VitePress)
        working-directory: course
        run: |
          npm ci
          npx vitepress build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
