name: deploy-course

# 客户使用教程静态站发布流水线(权威定义在私有仓库 course/pipeline/ 本文件,
# 由私有仓库 course-dispatch 工作流同步到本仓库并派发)。
# 与 build-deb 同构:课程源码不落公开 git,构建时用 PRIVATE_SOURCE_TOKEN
# 拉取私有仓库对应 commit 的 course/ 目录(VitePress 源)到 runner 临时
# 工作区,构建后发布到 GitHub Pages。仅 workflow_dispatch 触发,不接受 push 源码。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "私有仓库 xr-esp-private/xr-h1-ros2 的 commit/branch(课程源码位置)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve private source ref
        id: srcref
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          set -eo pipefail
          REF="${{ inputs.ref }}"
          [[ -n "$REF" ]] || REF=$(gh api repos/xr-esp-private/xr-h1-ros2/commits/main --jq .sha)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "building course from xr-esp-private/xr-h1-ros2@$REF"

      - name: Check out private course sources
        uses: actions/checkout@v4
        with:
          repository: xr-esp-private/xr-h1-ros2
          ref: ${{ steps.srcref.outputs.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          sparse-checkout: course
          path: private-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-src/course/package-lock.json

      - name: Build site (VitePress)
        run: |
          set -eo pipefail
          cd private-src/course
          npm ci
          npx vitepress build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: private-src/course/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
